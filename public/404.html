<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>El Sheikh</title>
    <script>
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrite, so a deep link (e.g. a page
      // refresh on /admin/waterFilling) 404s. This encodes the requested path
      // into a query string and redirects to the real index.html, which
      // restores it before the app boots (see the matching script there).
      var pathSegmentsToKeep = 1; // "/elsheikh-oil-qr" is a project-page segment to preserve.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
